name: Update Viber business link

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-and-verify:
    if: github.event.issue.title == 'run-viber-link-update-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace every Viber link and verify the site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = 'viber://chat?number=%2B381666608060'
          new = 'https://viber.me/381666608060'
          old_count = text.count(old)
          if old_count != 5:
              raise SystemExit(f'Expected exactly 5 old Viber links, found {old_count}. No file was changed.')

          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          checks = {
              'old Viber links removed': old not in updated,
              'all five new Viber links present': updated.count(new) == 5,
              'phone number preserved': '+381666608060' in updated and '066 660 80 60' in updated,
              'Instagram link preserved': 'https://www.instagram.com/pizzajeterapija_drpizza?igsh=ZTA2ZWZka3hmZHpw' in updated,
              'Facebook link preserved': 'https://www.facebook.com/share/1Esy565ThE/' in updated,
              'GTM script preserved': "GTM-WRRHGMD3" in updated and 'googletagmanager.com/gtm.js' in updated,
              'GTM noscript preserved': 'googletagmanager.com/ns.html?id=GTM-WRRHGMD3' in updated,
              'menu price helper preserved': 'getMinimumPrice' in updated,
              'menu image CTA preserved': 'Klikni za cene' in updated,
              'menu offer CTA preserved': 'Pogledaj ponudu' in updated,
              'category modal preserved': 'category-modal-grid' in updated,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Verification failed: ' + ', '.join(failed))

          # Verify local assets referenced by src/href exist. Ignore external links,
          # protocols, fragments, templates, and dynamically generated values.
          refs = set(re.findall(r'(?:src|href)=["\']([^"\']+)["\']', updated))
          prefixes = ('http://', 'https://', 'tel:', 'mailto:', 'data:', '#', 'javascript:')
          missing = []
          for ref in refs:
              if ref.startswith(prefixes) or '${' in ref or '{{' in ref:
                  continue
              clean = ref.split('?', 1)[0].split('#', 1)[0].lstrip('/')
              if clean and not Path(clean).exists():
                  missing.append(clean)
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(sorted(set(missing))))

          cname = Path('CNAME').read_text(encoding='utf-8').strip()
          if cname != 'drpizza.rs':
              raise SystemExit(f'Unexpected CNAME: {cname!r}')

          print('All content, link, menu, tracking, domain, and local-asset checks passed.')
          PY

          # Parse-check every inline JavaScript block.
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          Path('/tmp/inline-scripts.js').write_text('\n;\n'.join(blocks), encoding='utf-8')
          print(f'Prepared {len(blocks)} inline script blocks for syntax validation.')
          PY
          node --check /tmp/inline-scripts.js

          # Serve the exact repository locally and verify the homepage responds.
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/doktorpizza-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/ >/tmp/doktorpizza-homepage.html
          grep -q 'https://viber.me/381666608060' /tmp/doktorpizza-homepage.html
          grep -q 'Klikni za cene' /tmp/doktorpizza-homepage.html
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Commit only the verified update and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-viber-business-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-viber-business-link.yml
          git diff --cached --check
          git commit -m 'Fix Viber business link and verify site'
          git push origin HEAD:main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --comment "Viber business link updated in all five locations. Automated checks passed and the temporary workflow removed itself."
